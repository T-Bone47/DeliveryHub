<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">DH</span>
      <span>DeliveryHub</span>
    </div>
    <h1>Create account</h1>
    <p class="subtitle">Set up a customer or agent account to get started.</p>

    @if (errorMessage()) {
      <div class="alert alert-error" role="alert">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" formControlName="fullName" autocomplete="name"
          [class.invalid]="form.controls.fullName.invalid && form.controls.fullName.touched" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email"
          [class.invalid]="form.controls.email.invalid && form.controls.email.touched" />
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" formControlName="phone" autocomplete="tel"
          [class.invalid]="form.controls.phone.invalid && form.controls.phone.touched" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password"
          [class.invalid]="form.controls.password.invalid && form.controls.password.touched" />
        <span class="hint">At least 8 characters.</span>
      </div>

      <div class="field">
        <label for="role">Account type</label>
        <select id="role" formControlName="role">
          <option value="CUSTOMER">Customer</option>
          <option value="AGENT">Delivery agent</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary auth-submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>
</div>
